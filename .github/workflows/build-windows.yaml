name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows app
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pandas openpyxl pyinstaller

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller diario_alimentare.spec --clean -y

      - name: Prepare exe (onefile)
        id: pkg
        shell: pwsh
        run: |
          if (Test-Path "dist/DiarioAlimentare.exe") {
            Copy-Item "dist/DiarioAlimentare.exe" "dist/DiarioAlimentare-Windows.exe" -Force
            "artifact_exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "artifact_exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Publish to Release (on tag)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.pkg.outputs.artifact_exists == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DiarioAlimentare-Windows.exe

      - name: Upload artifact
        # Non bloccante: se la quota artifact è piena, la Release resta comunque pubblicata.
        continue-on-error: true
        if: ${{ steps.pkg.outputs.artifact_exists == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: DiarioAlimentare-Windows
          path: dist/DiarioAlimentare-Windows.exe
          retention-days: 7
