name: Build macOS

on:
 push:
   tags:
    - 'v*'
 workflow_dispatch:

env:
 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
 build:
   runs-on: macos-latest

   steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
       pip install PyQt6 pandas openpyxl pyinstaller

    - name: Build with PyInstaller
      run: |
       python -m PyInstaller diario_alimentare.spec --clean -y

    - name: Sign app bundle (ad-hoc)
      run: |
       APP="dist/DiarioAlimentare.app"

       # Remove static stub libraries that conflict with signing
       find "$APP" -name "*.a" -delete

       # Ad-hoc deep sign (inside-out, single pass)
       codesign --force --deep --sign - "$APP"

       # Verify
       codesign --verify --deep "$APP"

    - name: Zip .app bundle
      run: |
       cd dist
       zip -r DiarioAlimentare-macOS.zip DiarioAlimentare.app

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: DiarioAlimentare-macOS
        path: dist/DiarioAlimentare-macOS.zip
        retention-days: 30



