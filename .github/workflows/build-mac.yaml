name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build macOS app
    runs-on: macos-26

    env:
      CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
      CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
      CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install PyQt6 pandas openpyxl pyinstaller

      - name: Show PyQt6 plugin path on runner
        run: |
          python - <<'PY'
          try:
              from PyQt6 import QtCore
              print('QLibrary plugins path (runner):', QtCore.QLibraryInfo.path(QtCore.QLibraryInfo.LibraryPath.PluginsPath))
          except Exception as e:
              print('Error printing QLibraryInfo path:', e)
          PY

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller diario_alimentare.spec --clean -y

      - name: Inspect Qt plugins in .app
        if: ${{ always() }}
        run: |
          APP="dist/DiarioAlimentare.app"
          echo "Inspecting $APP"
          if [ -d "$APP" ]; then
            echo "Contents:"
            ls -la "$APP/Contents" || true
            echo "Frameworks:"
            ls -la "$APP/Contents/Frameworks" || true
            echo "PlugIns:"
            ls -la "$APP/Contents/PlugIns" || true
            echo "Resources:"
            ls -la "$APP/Contents/Resources" || true
            echo "Recursive plugin files and types:"
            find "$APP/Contents/PlugIns" -type f -maxdepth 4 -print -exec file {} \; || true
            echo "Searching for permission/qdarwin files:"
            find "$APP" \( -iname "*permission*" -o -iname "*qdarwin*" \) -print || true
          else
            echo "$APP not found"
          fi

      - name: Run packaged app with QT_DEBUG_PLUGINS and upload logs
        if: ${{ always() }}
        run: |
          APP="dist/DiarioAlimentare.app"
          LOGDIR=logs
          ARCHIVE=qt_plugins_logs.tar.gz
          rm -f "$ARCHIVE"
          rm -rf "$LOGDIR"
          mkdir -p "$LOGDIR"
          if [ -d "$APP" ]; then
            echo "Running $APP with QT_DEBUG_PLUGINS=1 in background"
            QT_DEBUG_PLUGINS=1 "$APP/Contents/MacOS/DiarioAlimentare" > "$LOGDIR/qt_plugins_stdout.log" 2> "$LOGDIR/qt_plugins_stderr.log" &
            APP_PID=$!
            echo "App PID: $APP_PID"
            sleep 10
            if ps -p "$APP_PID" > /dev/null; then
              echo "App still running after timeout; sending TERM"
              kill "$APP_PID" || true
              sleep 5
            fi
            if ps -p "$APP_PID" > /dev/null; then
              echo "App still running after TERM; sending KILL"
              kill -9 "$APP_PID" || true
              sleep 2
            fi
            echo "Process status after shutdown attempt:"
            ps -p "$APP_PID" || true
            echo "Collecting plugin files list"
            find "$APP/Contents/PlugIns" -type f -maxdepth 4 -print > "$LOGDIR/plugins_list.txt" || true
            tar -czf "$ARCHIVE" -C "$LOGDIR" . || true
            ls -la "$ARCHIVE" || true
          else
            echo "$APP not found; skipping run"
          fi

      - name: Upload QT plugin logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: DiarioAlimentare-qt-plugin-logs
          path: qt_plugins_logs.tar.gz
          retention-days: 7

      - name: Remove static libs that break signing
        run: |
          APP="dist/DiarioAlimentare.app"
          find "$APP" -name "*.a" -delete || true

      - name: Import signing certificate (p12) into temporary keychain
        id: import-cert
        if: ${{ env.CERTIFICATE_P12 != '' && env.CERT_PASSWORD != '' }}
        env:
          P12_B64: ${{ env.CERTIFICATE_P12 }}
          P12_PASS: ${{ env.CERT_PASSWORD }}
        run: |
          set -e
          echo "$P12_B64" | base64 --decode > cert.p12
          KEYCHAIN=build.keychain
          security create-keychain -p "$P12_PASS" "$KEYCHAIN" || true
          security import cert.p12 -k "$KEYCHAIN" -P "$P12_PASS" -T /usr/bin/codesign -T /usr/bin/security || true
          security list-keychains -s "$KEYCHAIN"
          security unlock-keychain -p "$P12_PASS" "$KEYCHAIN"
          security set-key-partition-list -S apple-tool: -s -k "$P12_PASS" "$KEYCHAIN" || true

          # extract first codesigning identity common name
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F '"' '/"/ {print $2; exit}' || true)
          echo "identity=$IDENTITY" >> $GITHUB_OUTPUT

      - name: Codesign (use imported identity or secret)
        if: ${{ env.CODESIGN_IDENTITY != '' || env.CERTIFICATE_P12 != '' }}
        env:
          SECRET_IDENTITY: ${{ env.CODESIGN_IDENTITY }}
        run: |
          APP="dist/DiarioAlimentare.app"
          IMPORTED_IDENTITY="${{ steps.import-cert.outputs.identity }}"
          IDENTITY="$IMPORTED_IDENTITY"
          if [ -z "$IDENTITY" ]; then
            IDENTITY="$SECRET_IDENTITY"
          fi

          if [ -z "$IDENTITY" ]; then
            echo "No codesign identity available; skipping codesign"
            exit 0
          fi

          echo "Using identity: $IDENTITY"
          codesign --force --deep --options runtime --entitlements /dev/null --sign "$IDENTITY" "$APP"
          codesign --verify --deep "$APP"

      - name: Notarize (if Apple credentials provided)
        if: ${{ env.APPLE_ID != '' && env.APPLE_PASSWORD != '' }}
        env:
          APPLE_ID: ${{ env.APPLE_ID }}
          APPLE_PASSWORD: ${{ env.APPLE_PASSWORD }}
        run: |
          APP="dist/DiarioAlimentare.app"
          cd dist
          zip -r DiarioAlimentare-macOS.zip DiarioAlimentare.app
          xcrun notarytool submit DiarioAlimentare-macOS.zip --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --wait || exit 1
          xcrun stapler staple "$APP" || true

      - name: Zip final .app
        id: zip-final
        run: |
          if [ -d "dist/DiarioAlimentare.app" ]; then
            cd dist
            zip -r DiarioAlimentare-macOS.zip DiarioAlimentare.app
            echo "artifact_exists=true" >> $GITHUB_OUTPUT
          else
            echo "artifact_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload final artifact
        if: ${{ steps.zip-final.outputs.artifact_exists == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: DiarioAlimentare-macOS
          path: dist/DiarioAlimentare-macOS.zip
          retention-days: 30




